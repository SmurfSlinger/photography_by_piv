# Deploy Photography by Piv on the R310 self-hosted runner (no public SSH).
# Setup: deploy/README-ci.md
name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Deploy production
        run: bash --norc --noprofile /home/smurfslinger/photography_by_piv/deploy/github-actions-deploy.sh

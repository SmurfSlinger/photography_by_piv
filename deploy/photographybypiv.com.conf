# HTTP → HTTPS
<VirtualHost *:80>
    ServerName photographybypiv.com
    ServerAlias www.photographybypiv.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName photographybypiv.com
    ServerAlias www.photographybypiv.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/photographybypiv.com.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/photographybypiv.com.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s

    ProxyPass        / http://127.0.0.1:3000/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:3000/

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/photographybypiv-error.log
    CustomLog ${APACHE_LOG_DIR}/photographybypiv-access.log combined
</VirtualHost>
</IfModule>
